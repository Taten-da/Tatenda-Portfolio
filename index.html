<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tatenda Takavarasha</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400&display=swap" rel="stylesheet">
<style>
  /* ---------------------------------------------------------------
     Loading-frame  ·  Figma node 402:277
     Sequence runs once (9.4407s) and holds on the mailto link.
     Timings are the exact keyframe percentages from the Figma timeline.
     --------------------------------------------------------------- */

  :root {
    --seq-duration: 9.4407s;
    --ink: #151515;
    --ink-hover: #555555;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    background: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }

  /* 273 × 19 frame, contents clipped */
  .loading-frame {
    position: relative;
    width: 273px;
    height: 19px;
    overflow: hidden;
  }

  /* --- text lines ------------------------------------------------ */
  .line {
    position: absolute;
    top: calc(50% - 10.38px);
    margin: 0;
    font-size: 16px;
    font-weight: 400;
    font-style: normal;
    line-height: normal;
    white-space: nowrap;
    word-break: break-word;
    color: var(--ink);
    opacity: 0;
    animation-duration: var(--seq-duration);
    animation-timing-function: linear;
    animation-iteration-count: 1;
    animation-fill-mode: forwards;
  }

  .line--1 { left: calc(50% - 67.5px);  animation-name: line-1; }
  .line--2 { left: calc(50% - 100px);   animation-name: line-2; }
  .line--3 { left: calc(50% - 81.5px);  animation-name: line-3; }
  .line--4 { left: calc(50% - 96px);    animation-name: line-4; }
  .line--5 {
    left: calc(50% - 121px);
    animation-name: line-5;
    visibility: hidden; /* revealed by the keyframes at 83.488% */
  }

  /* --- the mailto ------------------------------------------------ */
  .email {
    text-decoration: none;
    color: var(--ink);
    transition: color 420ms cubic-bezier(0.33, 0, 0.2, 1);
  }

  .email:hover,
  .email:focus-visible {
    color: var(--ink-hover);
  }

  .email:focus-visible {
    outline: 1px solid var(--ink-hover);
    outline-offset: 3px;
  }

  /* --- wipes ----------------------------------------------------- */
  .wipe {
    position: absolute;
    left: 50%;
    top: calc(50% - 0.5px);
    width: 74.965px;
    height: 83.806px;
    display: flex;
    align-items: center;
    justify-content: center;
    transform: translate(-50%, -50%);
    pointer-events: none;
    animation-duration: var(--seq-duration);
    animation-timing-function: linear;
    animation-iteration-count: 1;
    animation-fill-mode: forwards;
  }

  .wipe__rotor {
    display: block;
    flex: none;
    animation-duration: var(--seq-duration);
    animation-timing-function: linear;
    animation-iteration-count: 1;
    animation-fill-mode: forwards;
  }

  .wipe__bar {
    display: block;
    width: 39px;
    height: 75px;
    background: rgba(255, 255, 255, 0.9);
    filter: blur(9px);
  }

  .wipe--1 { animation-name: wipe-1-x; }
  .wipe--1 .wipe__rotor { animation-name: wipe-1-r; }
  .wipe--2 { animation-name: wipe-2-x; }
  .wipe--2 .wipe__rotor { animation-name: wipe-2-r; }
  .wipe--3 { animation-name: wipe-3-x; }
  .wipe--3 .wipe__rotor { animation-name: wipe-3-r; }
  .wipe--4 { animation-name: wipe-4-x; }
  .wipe--4 .wipe__rotor { animation-name: wipe-4-r; }

  /* ================= keyframes: text ============================= */

  @keyframes line-1 { /* thanks for visiting */
    0%       { opacity: 0; animation-timing-function: cubic-bezier(0.5, 0, 0, 1); }
    0.266%   { opacity: 1; }
    14.736%  { opacity: 1; animation-timing-function: cubic-bezier(1, 0, 0.5, 1); }
    14.991%  { opacity: 0; }
    100%     { opacity: 0; }
  }

  @keyframes line-2 { /* currently updating the site */
    0%       { opacity: 0; }
    14.736%  { opacity: 0; animation-timing-function: cubic-bezier(0.5, 0, 0, 1); }
    15.163%  { opacity: 1; }
    38.378%  { opacity: 1; animation-timing-function: cubic-bezier(1, 0, 0.5, 1); }
    38.788%  { opacity: 0; }
    100%     { opacity: 0; }
  }

  @keyframes line-3 { /* should be ready soon */
    0%       { opacity: 0; }
    38.634%  { opacity: 0; animation-timing-function: cubic-bezier(0.5, 0, 0, 1); }
    38.997%  { opacity: 1; }
    58.709%  { opacity: 1; animation-timing-function: cubic-bezier(1, 0, 0.5, 1); }
    59.057%  { opacity: 0; }
    100%     { opacity: 0; }
  }

  @keyframes line-4 { /* drop me an email for now */
    0%       { opacity: 0; }
    59.057%  { opacity: 0; animation-timing-function: cubic-bezier(0.5, 0, 0, 1); }
    59.491%  { opacity: 1; }
    83.071%  { opacity: 1; animation-timing-function: cubic-bezier(1, 0, 0.5, 1); }
    83.488%  { opacity: 0; }
    100%     { opacity: 0; }
  }

  /* final line holds — no loop-out fade */
  @keyframes line-5 { /* the mailto */
    0%       { opacity: 0; visibility: hidden; }
    83.488%  { opacity: 0; visibility: hidden; animation-timing-function: cubic-bezier(0.5, 0, 0, 1); }
    83.892%  { opacity: 1; visibility: visible; }
    100%     { opacity: 1; visibility: visible; }
  }

  /* ================= keyframes: wipes ============================ */

  @keyframes wipe-1-x {
    0%       { translate: 119.5px 0; animation-timing-function: cubic-bezier(0.333, 0, 0, 1); }
    14.991%  { translate: -146.5px 0; }
    100%     { translate: -146.5px 0; }
  }
  @keyframes wipe-1-r {
    0%       { rotate: 35deg; animation-timing-function: cubic-bezier(0.5, 0, 0.051, 1); }
    14.991%  { rotate: -35deg; }
    100%     { rotate: -35deg; }
  }

  @keyframes wipe-2-x {
    0%       { translate: -151.5px 0; }
    12.313%  { translate: -151.5px 0; animation-timing-function: cubic-bezier(0.876, 0, 0.562, 1); }
    30.892%  { translate: 171.5px 0; }
    100%     { translate: 171.5px 0; }
  }
  @keyframes wipe-2-r {
    0%       { rotate: -35deg; }
    12.313%  { rotate: -35deg; animation-timing-function: cubic-bezier(1, 0, 0.5, 1); }
    30.892%  { rotate: 35deg; }
    100%     { rotate: 35deg; }
  }

  @keyframes wipe-3-x {
    0%       { translate: 119.5px 0; }
    38.378%  { translate: 119.5px 0; animation-timing-function: cubic-bezier(0.333, 0, 0, 1); }
    53.370%  { translate: -130.5px 0; }
    100%     { translate: -130.5px 0; }
  }
  @keyframes wipe-3-r {
    0%       { rotate: 35deg; }
    38.378%  { rotate: 35deg; animation-timing-function: cubic-bezier(0.5, 0, 0.051, 1); }
    53.370%  { rotate: -35deg; }
    100%     { rotate: -35deg; }
  }

  @keyframes wipe-4-x {
    0%       { translate: -156.5px 0; }
    58.802%  { translate: -156.5px 0; animation-timing-function: cubic-bezier(0.876, 0, 0.562, 1); }
    73.793%  { translate: 170.5px 0; }
    100%     { translate: 170.5px 0; }
  }
  @keyframes wipe-4-r {
    0%       { rotate: -35deg; }
    58.802%  { rotate: -35deg; animation-timing-function: cubic-bezier(1, 0, 0.5, 1); }
    73.793%  { rotate: 35deg; }
    100%     { rotate: 35deg; }
  }

  /* ================= reduced motion ============================== */
  @media (prefers-reduced-motion: reduce) {
    .line    { animation: none; opacity: 0; }
    .line--5 { opacity: 1; visibility: visible; }
    .wipe, .wipe__rotor { animation: none; }
    .wipe { display: none; }
  }
</style>
</head>
<body>

  <!-- Loading-frame · 402:277 -->
  <div class="loading-frame" role="status" aria-live="polite">

    <p class="line line--4">drop me an email for now</p>

    <span class="wipe wipe--4" aria-hidden="true"><span class="wipe__rotor"><span class="wipe__bar"></span></span></span>

    <p class="line line--3">should be ready soon</p>

    <span class="wipe wipe--3" aria-hidden="true"><span class="wipe__rotor"><span class="wipe__bar"></span></span></span>

    <p class="line line--2">currently updating the site</p>

    <span class="wipe wipe--2" aria-hidden="true"><span class="wipe__rotor"><span class="wipe__bar"></span></span></span>

    <p class="line line--1">thanks for visiting</p>

    <span class="wipe wipe--1" aria-hidden="true"><span class="wipe__rotor"><span class="wipe__bar"></span></span></span>

    <p class="line line--5">
      <a class="email" href="mailto:tatendatakavarasha@gmail.com">tatendatakavarasha@gmail.com</a>
    </p>

  </div>

</body>
</html>
